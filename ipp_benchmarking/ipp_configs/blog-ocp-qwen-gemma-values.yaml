# IPP helm values for the latency-blog benchmark on ocp-qwen-gemma-multi.
# Same pipeline validated on Kind (avgttft-blog-values.yaml): model-group-name-filter
# + avg-ttft/inflight blended scoring + max-score picker.
payloadProcessor:
  listModels:
    - Qwen/Qwen3-8B
    - Qwen/Qwen3-32B   # swap with the final "Gemma 4 31B" id
  customConfig:
    plugins:
    - type: body-field-to-header
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: base-model-to-header
    - type: model-selector
    - type: model-group-name-filter
    - type: avg-ttft-scorer
    - type: inflight-requests-scorer
    - type: max-score-picker
    - type: request-metadata-extractor
    - type: model-config-datasource
      parameters:
        modelsPath: /config/models.json
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-selector
        - pluginRef: model-group-name-filter
        - pluginRef: avg-ttft-scorer
          weight: 1.0
        # Per-request negative feedback; damps the winner-take-all stampedes
        # seen with avg-ttft alone (see kind rehearsal findings, README §C).
        # Lower this weight (e.g. 0.3) to favor the fast model harder while
        # the system is unsaturated.
        - pluginRef: inflight-requests-scorer
          weight: 1.0
        - pluginRef: max-score-picker
        - pluginRef: body-field-to-header
        - pluginRef: base-model-to-header
    datalayer:
      extractors:
      - pluginRef: request-metadata-extractor
      datasources:
      - pluginRef: model-config-datasource
