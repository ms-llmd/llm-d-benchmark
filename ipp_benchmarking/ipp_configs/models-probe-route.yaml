# The harness verifies a stack with a bodyless `GET /v1/models`. IPP only sets
# X-Gateway-Base-Model-Name when it can parse a model from the request BODY, so that GET matches
# no header-based route and Envoy answers 404 -> every run dies at step 04 verify_model.
# This path-only rule gives it somewhere to land. /v1/completions never matches /v1/models, so
# benchmark traffic is untouched. Any pool will do -- it only serves the model list.
#
#   sed "s|<inference-pool>|$(oc get inferencepool -n $NAMESPACE -o name | head -1 | cut -d/ -f2)|" \
#     ipp_benchmarking/ipp_configs/models-probe-route.yaml | oc apply -n $NAMESPACE -f -
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: models-probe-route
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: infra-llmdbench-inference-gateway
  rules:
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: <inference-pool>
      port: 8000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /v1/models
    timeouts:
      backendRequest: 0s
      request: 1200s
