# IPP helm values (PR188 image) for the Kind sim: queue-ttft-scorer over the two fake-latency
# sims opt-125m (slow) + opt-350m (fast). Every request is scored across BOTH sims; the scorer
# predicts per-model effectiveTTFT under load and max-score-picker routes to the lower one.
# Pipeline mirrors PR188 examples/medianttft-values.yaml; provider/image/gateway added for Kind.
provider:
  name: istio
  messageTimeout: 1200s
  supportedEvents:
    requestTrailers: true
    responseHeaders: true
    responseBody: true
inferenceGateway:
  name: infra-llmdbench-inference-gateway
payloadProcessor:
  image:
    # Build the IPP yourself and supply your own registry, e.g.
    #   --set payloadProcessor.image.registry=ghcr.io/<you>
    # The tag below names the IPP build this arm requires.
    repository: llm-d-inference-payload-processor
    tag: ttft-scorer
    pullPolicy: Never
  listModels:
    - facebook/opt-125m
    - facebook/opt-350m
  customConfig:
    plugins:
    - type: body-field-to-header
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: base-model-to-header
    - type: model-selector
    - type: queue-ttft-scorer
      parameters:
        explorationRate: 0.1
    - type: max-score-picker
    - type: ttft-percentile-extractor
      parameters:
        intervalDuration: 1s
        windowSize: 5000
        maxObservationAge: 3m
        inflightEmaAlpha: 0.2
        lowLoadWindowAge: 1h
        maxRequests: 100
        minRequests: 20
    - type: model-config-datasource
      parameters:
        modelsPath: /config/models.json
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-selector
        - pluginRef: queue-ttft-scorer
          weight: 1.0
        - pluginRef: max-score-picker
        - pluginRef: body-field-to-header
        - pluginRef: base-model-to-header
    datalayer:
      extractors:
      - pluginRef: ttft-percentile-extractor
      datasources:
      - pluginRef: model-config-datasource
