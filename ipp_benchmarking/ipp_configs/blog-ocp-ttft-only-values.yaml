payloadProcessor:
  listModels:
    - facebook/opt-125m
    - facebook/opt-350m
  customConfig:
    plugins:
    - type: body-field-to-header
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: base-model-to-header
    - type: model-selector
    - type: model-group-name-filter
    - type: avg-ttft-scorer
    - type: inflight-requests-scorer
    - type: max-score-picker
    - type: request-metadata-extractor
    - type: model-config-datasource
      parameters:
        modelsPath: /config/models.json
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-selector
        - pluginRef: model-group-name-filter
        - pluginRef: avg-ttft-scorer
          weight: 1.0
        # Inflight count updates at request time (no EMA lag): each pick
        # immediately lowers the picked model's next score, damping the
        # winner-take-all stampedes seen with avg-ttft alone.
        - pluginRef: inflight-requests-scorer
          weight: 1.0
        - pluginRef: max-score-picker
        - pluginRef: body-field-to-header
        - pluginRef: base-model-to-header
    datalayer:
      extractors:
      - pluginRef: request-metadata-extractor
      datasources:
      - pluginRef: model-config-datasource
