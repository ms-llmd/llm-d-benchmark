# OpenShift Multi-Model Qwen3-8B + Qwen3-32B IPP Scenario (latency-blog benchmark)
#
# Topology for the "idle big model absorbs the summarizer's overflow" story
# (README section C): a small fast summarizer model and a big planner model,
# two InferencePools behind one shared Istio Gateway, routed by header match
# on `X-Gateway-Base-Model-Name` (injected by IPP).
#
#   Gateway (infra-llmdbench, shared)
#     HTTPRoute A: X-Gateway-Base-Model-Name: Qwen/Qwen3-8B          -> InferencePool A (small/fast)
#     HTTPRoute B: X-Gateway-Base-Model-Name: Qwen/Qwen3-32B  -> InferencePool B (big/slow)
#
# Story: a deep-research agent runs the 8B hundreds of times per task (summarize each
# crawled page: long-in/short-out) and the 32B only twice (plan + synthesize). The IPP
# latency scorer routes summarization OVERFLOW onto the idle 32B when the 8B TTFT spikes.
# The model-group-name-filter does the gating: planner requests name "Qwen/Qwen3-32B" (pinned
# big-only); summarizer requests name the JSON array ["Qwen/Qwen3-8B","Qwen/Qwen3-32B"]
# ("choose among" -> scorer/picker decides).
#
# BIG MODEL: the user story says "Gemma 4 31B"; this scenario uses
# Qwen/Qwen3-32B (the originally intended google/gemma-3-27b-it is a gated
# HF repo — 403 unless the HF_TOKEN account accepted the license). To swap,
# change the model id in: this file (stack B), the base-model ConfigMap,
# ipp_configs/blog-ocp-qwen-gemma-values.yaml (listModels), and the
# summarization_synthetic.yaml.in model_name array.
#
# Cluster requirements: as ocp-qwen3-multi (2x H100-80GB, GPU Operator,
# >=200Gi model PVC, HF_TOKEN). Qwen3-8B ~16GB BF16 fits easily;
# Qwen3-32B ~64GB BF16 needs --max-model-len 8192 patched post-standup
# (see AGENTS.md must-do #2).
#
# Run:
#   llmdbenchmark --spec cicd/ocp-qwen-gemma-multi standup -p "${NAMESPACE}"
#   # then deploy IPP with ipp_configs/blog-ocp-qwen-gemma-values.yaml
#   # and run the summarizer + planner profiles (README section C).

# ============================================================================
# SHARED -- merged into every stack before per-stack overrides
# ============================================================================
shared:
  affinity:
    enabled: true
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3

  accelerator:
    count: 1
    memory: 80

  modelservice:
    enabled: true
    uriProtocol: hf
  standalone:
    enabled: false

  httpRoute:
    enabled: false

  gateway:
    className: istio
    resources:
      limits:   { cpu: "2",    memory: 2Gi }
      requests: { cpu: "500m", memory: 512Mi }

  inferenceExtension:
    experimentalHttpRoute:
      requestTimeout: "60s"
    resources:
      requests: { cpu: "200m", memory: 512Mi }
      limits:   { cpu: "1",    memory: 1Gi }
    monitoring:
      prometheus:
        enabled: true

  monitoring:
    installPrometheusCrds: false

  vllmCommon:
    shmMemory: 8Gi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    flags:
      enforceEager: false
      disableLogRequests: true
      disableUvicornAccessLog: true

  prefill:
    enabled: false
    replicas: 0

  decode:
    replicas: 1
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    accelerator:
      count: 1

  storage:
    modelPvc:
      accessModes:
        - ReadWriteOnce
      size: 200Gi
    workloadPvc:
      accessModes:
        - ReadWriteMany
      size: 10Gi

  harness:
    name: inference-perf
    experimentProfile: summarization_synthetic.yaml
    resources:
      cpu: "8"
      memory: 32Gi

  workDir: "~/data/ocp-qwen-gemma-multi"

  monitoring:
    metricsScrapeEnabled: true
    scrapeInterval: "10s"

  runConfig:
    skipSmoketest: true
    skipModelVerify: true


# ============================================================================
# SCENARIO -- per-model stacks
# ============================================================================
scenario:
  # --------------------------------------------------------------------------
  # Qwen/Qwen3-8B  (small/fast "summarizer" pod)
  # --------------------------------------------------------------------------
  - name: "qwen3-8b"

    model:
      name: Qwen/Qwen3-8B
      shortName: qwen-qwen3-8b
      path: models/Qwen/Qwen3-8B
      huggingfaceId: Qwen/Qwen3-8B
      size: 20Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90

    inferenceExtension:
      experimentalHttpRoute:
        enabled: true
        inferenceGatewayName: infra-llmdbench-inference-gateway
        baseModel: "Qwen/Qwen3-8B"

    decode:
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        modelCommand: imageDefault

  # --------------------------------------------------------------------------
  # Qwen/Qwen3-32B  (big/slow "planner" pod)
  # Swap the id here when the actual "Gemma 4 31B" HF id is available.
  # --------------------------------------------------------------------------
  - name: "qwen3-32b"

    model:
      name: Qwen/Qwen3-32B
      shortName: qwen-qwen3-32b
      path: models/Qwen/Qwen3-32B
      huggingfaceId: Qwen/Qwen3-32B
      size: 70Gi               # BF16 checkpoint is ~64GB; 60Gi gets the pod
                               # evicted (emptyDir model-storage limit)
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90

    inferenceExtension:
      experimentalHttpRoute:
        enabled: true
        inferenceGatewayName: infra-llmdbench-inference-gateway
        baseModel: "Qwen/Qwen3-32B"

    decode:
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        modelCommand: imageDefault
