# OpenShift Qwen3-8B + Qwen3-32B -- single-stack RUN variant (summarizer harness).
#
# Standup/teardown with cicd/ocp-qwen3-8b-32b (deploys BOTH pools). Use THIS spec
# only for `run`, so a SINGLE summarizer harness drives load through the shared
# gateway. IPP routes across both pools regardless of the requested model, so one
# harness is the correct, unconfounded load source (see memory:
# ipp-compare-single-stack-harness). The Qwen3-32B pool is still deployed and
# remains a routing target for summarization overflow.
#
# Identical SHARED block to ocp-qwen3-8b-32b.yaml; only the `scenario:` list is
# trimmed to the 8B stack so the run phase deploys exactly one harness.

shared:
  # GPU placement comes from accelerator auto-detection. To pin a SKU, set
  # affinity.enabled: true + nodeSelector: {nvidia.com/gpu.product: <label>}.
  accelerator:
    count: 1
    memory: 80
  modelservice:
    enabled: true
    uriProtocol: hf
  standalone:
    enabled: false
  httpRoute:
    enabled: false
  gateway:
    className: istio
    resources:
      limits:   { cpu: "2",    memory: 2Gi }
      requests: { cpu: "500m", memory: 512Mi }
  # llm-d-router chart keys (chart default is cpu 8 / memory 8Gi)
  router:
    epp:
      resources:
        requests: { cpu: "200m", memory: 512Mi }
        limits:   { cpu: "1",    memory: 1Gi }
    monitoring:
      prometheus:
        enabled: true
  monitoring:
    installPrometheusCrds: false
  vllmCommon:
    shmMemory: 8Gi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    flags:
      enforceEager: false
      disableLogRequests: true
      disableUvicornAccessLog: true
  prefill:
    enabled: false
    replicas: 0
  decode:
    replicas: 1
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    accelerator:
      count: 1
  storage:
    modelPvc:
      accessModes:
        - ReadWriteOnce
      size: 200Gi
    workloadPvc:
      accessModes:
        - ReadWriteMany
      size: 30Gi
  harness:
    name: inference-perf
    experimentProfile: sweep_8stage_poisson.yaml
    resources:
      cpu: "8"
      memory: 96Gi
  workDir: "~/data/ocp-qwen3-8b-32b"
  monitoring:
    metricsScrapeEnabled: true
    scrapeInterval: "10s"
  runConfig:
    skipSmoketest: true
    skipModelVerify: true

# Only the 8B stack -> a single summarizer harness drives load.
scenario:
  - name: "qwen3-8b"
    model:
      name: Qwen/Qwen3-8B
      shortName: qwen-qwen3-8b
      path: models/Qwen/Qwen3-8B
      huggingfaceId: Qwen/Qwen3-8B
      size: 30Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90
    decode:
      replicas: 1
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        modelCommand: imageDefault
