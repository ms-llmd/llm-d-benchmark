# OpenShift multi-cluster EPP leaf stack -- Qwen3-8B, 1 GPU per decode pod.
#
# One llm-d stack per namespace; the namespaces stand in for peer clusters.
# Stand the same scenario up twice with asymmetric capacity:
#
#   llmdbenchmark --spec cicd/ocp-mc-leaf standup -p <prefix>-mc-a --set decode.replicas=2
#   llmdbenchmark --spec cicd/ocp-mc-leaf standup -p <prefix>-mc-b --set decode.replicas=3
#
# Unlike a two-pool-in-one-namespace layout, both leaves can serve the SAME
# model.name: every per-stack resource name derives from
# sha256(namespace/model.name), so separate namespaces already give separate
# identities. No -a/-b model aliases and no --served-model-name override.
#
# prometheus.auth stays off so the router EPP can scrape :9090 anonymously --
# multicluster-metrics-data-source has no bearer-token option and the scrape
# would 401. See epp_benchmarking/README.md.
#
# Cluster: OpenShift + NVIDIA GPU Operator, H100 80GB (1 GPU/pod).

scenario:
  - name: "ocp-mc-leaf"

    model:
      name: Qwen/Qwen3-8B
      shortName: qwen-qwen3-8b
      path: models/Qwen/Qwen3-8B
      huggingfaceId: Qwen/Qwen3-8B
      size: 30Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90

    accelerator:
      count: 1
      memory: 80

    gateway:
      className: istio
      resources:
        limits:   { cpu: "2",    memory: 2Gi }
        requests: { cpu: "500m", memory: 512Mi }

    router:
      epp:
        resources:
          requests: { cpu: "200m", memory: 512Mi }
          limits:   { cpu: "1",    memory: 1Gi }
      monitoring:
        prometheus:
          # Renders --metrics-endpoint-auth=false. Required: see header.
          auth:
            enabled: false

    monitoring:
      installPrometheusCrds: false
      metricsScrapeEnabled: true
      scrapeInterval: "10s"

    vllmCommon:
      shmMemory: 8Gi
      volumes:
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      flags:
        enforceEager: false
        disableLogRequests: true
        disableUvicornAccessLog: true

    storage:
      modelPvc:
        # Replicas spread across nodes mount one PVC -- RWO would multi-attach-fail.
        accessModes:
          - ReadWriteMany
        size: 200Gi
      workloadPvc:
        accessModes:
          - ReadWriteMany
        size: 96Gi

    modelservice:
      enabled: true
      uriProtocol: hf
    standalone:
      enabled: false

    decode:
      replicas: 1
      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1
      accelerator:
        count: 1
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"

    prefill:
      enabled: false
      replicas: 0

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      resources:
        cpu: "8"
        memory: 32Gi

    runConfig:
      skipSmoketest: false
      skipModelVerify: true
