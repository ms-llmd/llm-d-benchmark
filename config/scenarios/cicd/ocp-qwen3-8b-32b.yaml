# OpenShift Qwen3-8B + Qwen3-32B IPP Scenario  (deep-research-agent story)
#
# Two InferencePools behind one shared Istio Gateway, header-matched on
# X-Gateway-Base-Model-Name (injected by IPP), ONE decode pod each:
#   InferencePool A: Qwen/Qwen3-8B   ("small" summarizer model, saturated in the crawl phase)
#   InferencePool B: Qwen/Qwen3-32B  ("big" planner/synthesis model, idle most of the task)
#
# Story: a deep-research agent runs the 8B hundreds of times per task (summarize each
# crawled page: long-in/short-out) and the 32B only twice (plan + synthesize). The IPP
# latency scorer routes summarization OVERFLOW onto the idle 32B when the 8B TTFT spikes.
# The model-name-filter does the gating: planner requests name "Qwen/Qwen3-32B" (pinned
# big-only); summarizer requests name the JSON array ["Qwen/Qwen3-8B","Qwen/Qwen3-32B"]
# ("choose among" -> scorer/picker decides).
#
# Standup/teardown with THIS scenario (both pools). Drive the summarizer load with the
# single-stack RUN variant cicd/ocp-qwen3-8b-32b-summarizer (one harness; IPP routes
# across both pools regardless of which model the request names).
#
#   llmdbenchmark --spec cicd/ocp-qwen3-8b-32b standup -p <your-namespace>
#   # ... deploy IPP, patch --max-model-len, apply configmaps+httproutes (IPP_INSTRUCTIONS) ...
#   llmdbenchmark --spec cicd/ocp-qwen3-8b-32b-summarizer run -l inference-perf \
#       -w sweep_8stage_poisson.yaml
#   llmdbenchmark --spec cicd/ocp-qwen3-8b-32b teardown -p <your-namespace>
#
# Cluster: OpenShift + NVIDIA GPU Operator, 2x H100 80GB (1 GPU/pod). HF_TOKEN in env.

# ============================================================================
# SHARED -- merged into every stack before per-stack overrides
# ============================================================================
shared:
  # GPU placement comes from accelerator auto-detection. To pin a SKU, set
  # affinity.enabled: true + nodeSelector: {nvidia.com/gpu.product: <label>}.

  accelerator:
    count: 1
    memory: 80

  modelservice:
    enabled: true
    uriProtocol: hf
  standalone:
    enabled: false

  httpRoute:
    enabled: false

  gateway:
    className: istio
    resources:
      limits:   { cpu: "2",    memory: 2Gi }
      requests: { cpu: "500m", memory: 512Mi }

  # llm-d-router chart keys (chart default is cpu 8 / memory 8Gi)
  router:
    epp:
      resources:
        requests: { cpu: "200m", memory: 512Mi }
        limits:   { cpu: "1",    memory: 1Gi }
    monitoring:
      prometheus:
        enabled: true

  monitoring:
    installPrometheusCrds: false

  vllmCommon:
    shmMemory: 8Gi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    flags:
      enforceEager: false
      disableLogRequests: true
      disableUvicornAccessLog: true

  prefill:
    enabled: false
    replicas: 0

  decode:
    replicas: 1
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    accelerator:
      count: 1

  # 8B (~16GB BF16) + 32B (~64GB BF16) checkpoints + headroom.
  storage:
    modelPvc:
      # One decode pod per pool mounts its own modelPvc -> RWO is sufficient.
      accessModes:
        - ReadWriteOnce
      size: 200Gi
    workloadPvc:
      # RWX so harness + helper pods can attach across nodes (avoids the RWO
      # multi-attach stall); ibm-spectrum-scale-fileset supports ReadWriteMany.
      accessModes:
        - ReadWriteMany
      size: 96Gi

  harness:
    name: inference-perf
    experimentProfile: sweep_8stage_poisson.yaml
    resources:
      cpu: "8"
      memory: 32Gi

  workDir: "~/data/ocp-qwen3-8b-32b"

  monitoring:
    metricsScrapeEnabled: true
    scrapeInterval: "10s"

  runConfig:
    skipSmoketest: true
    skipModelVerify: true


# ============================================================================
# SCENARIO -- per-model stacks (1 decode pod each)
# ============================================================================
scenario:
  # --------------------------------------------------------------------------
  # Qwen3-8B  (small summarizer model -- saturated in the crawl phase)
  # --------------------------------------------------------------------------
  - name: "qwen3-8b"

    # Per-stack metrics-reader Secret. Set on BOTH keys: the router chart reads
    # prometheus.auth.secretName, the RBAC template reads monitoring.secretName.
    router:
      monitoring:
        secretName: inference-gateway-sa-metrics-reader-secret-qwen3-8b
        prometheus:
          auth:
            secretName: inference-gateway-sa-metrics-reader-secret-qwen3-8b

    model:
      name: Qwen/Qwen3-8B
      shortName: qwen-qwen3-8b
      path: models/Qwen/Qwen3-8B
      huggingfaceId: Qwen/Qwen3-8B
      size: 30Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90


    decode:
      replicas: 1
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        modelCommand: imageDefault

  # --------------------------------------------------------------------------
  # Qwen3-32B  (big planner/synthesis model -- idle most of the task)
  # --------------------------------------------------------------------------
  - name: "qwen3-32b"

    router:
      monitoring:
        secretName: inference-gateway-sa-metrics-reader-secret-qwen3-32b
        prometheus:
          auth:
            secretName: inference-gateway-sa-metrics-reader-secret-qwen3-32b

    model:
      name: Qwen/Qwen3-32B
      shortName: qwen-qwen3-32b
      path: models/Qwen/Qwen3-32B
      huggingfaceId: Qwen/Qwen3-32B
      size: 70Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90


    decode:
      replicas: 2
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        modelCommand: imageDefault
