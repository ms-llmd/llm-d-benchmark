# OpenShift adaptive-routing scenario -- TWO DIFFERENT models, one pool each, behind one
# shared Istio Gateway + IPP. Gemma-4 26B-A4B (fp8) and Qwen3.6 35B-A3B (fp8): similar
# quality, similar perf (+-20%). The IPP ttft-aware scorer routes the shared workload to
# whichever pool has spare capacity; pinned per-model workloads toggle load on/off.
#
# Unlike the same-model dual-pool (alias trick), each pool serves ONLY its own real name --
# the IPP rewrites the request `model` to the picked real name, so no --served-model-name
# aliasing is needed. imageDefault is fine; USER/LOGNAME env under shared.decode avoids the
# OCP arbitrary-UID getpwuid crashloop.
#
#   llmdbenchmark --spec cicd/ocp-gemma-qwen-adaptive standup -p $NAMESPACE
#   # then: install IPP (ipp_configs/adaptive-gemma-qwen-smart-values.yaml), apply the two
#   # base-model ConfigMaps, gen_httproutes.sh, drive with tools/adaptive_toggle_run.sh
#   llmdbenchmark --spec cicd/ocp-gemma-qwen-adaptive teardown -p $NAMESPACE
# Cluster: OpenShift + NVIDIA GPU Operator, H100-80GB (1 GPU/pod, 2 pods total). HF_TOKEN in env.

shared:
  # GPU placement comes from accelerator auto-detection. To pin a SKU, set
  # affinity.enabled: true + nodeSelector: {nvidia.com/gpu.product: <label>}.
  accelerator:
    count: 1
    memory: 80
  modelservice:
    enabled: true
    uriProtocol: hf
  standalone:
    enabled: false
  httpRoute:
    enabled: false
  gateway:
    className: istio
    resources:
      limits:   { cpu: "2",    memory: 2Gi }
      requests: { cpu: "500m", memory: 512Mi }
  # llm-d-router chart keys (chart default is cpu 8 / memory 8Gi)
  router:
    epp:
      resources:
        requests: { cpu: "200m", memory: 512Mi }
        limits:   { cpu: "1",    memory: 1Gi }
    monitoring:
      prometheus:
        enabled: true
  monitoring:
    installPrometheusCrds: false
  vllmCommon:
    shmMemory: 8Gi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    flags:
      enforceEager: false
      disableLogRequests: true
      disableUvicornAccessLog: true
  prefill:
    enabled: false
    replicas: 0
  decode:
    replicas: 1
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    accelerator:
      count: 1
    # LOGNAME only: the env macro (_macros.j2) already emits USER, and a second one
    # is a duplicate env key that Helm 4 server-side apply rejects.
    extraEnvVars:
      - name: LOGNAME
        value: vllm
  storage:
    modelPvc:
      accessModes:
        - ReadWriteMany   # one PVC, two pods (distinct model.path subdirs) -> RWX
      size: 200Gi
    workloadPvc:
      accessModes:
        - ReadWriteMany
      size: 96Gi
  harness:
    name: inference-perf
    experimentProfile: adaptive_shared_sharegpt.yaml
    resources:
      cpu: "8"
      memory: 32Gi
  workDir: "~/data/ocp-gemma-qwen-adaptive"
  monitoring:
    metricsScrapeEnabled: true
    scrapeInterval: "10s"
  runConfig:
    skipSmoketest: true
    skipModelVerify: true

scenario:
  # Pool A -- Gemma-4 26B-A4B fp8, 1 pod / 1 GPU
  - name: "gemma4-26b-fp8"
    model:
      name: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
      shortName: gemma4-26b-fp8
      path: models/RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
      huggingfaceId: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
      size: 40Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90
    decode:
      replicas: 1
      resources:
        limits:   { memory: 80Gi, cpu: "16", nvidia.com/gpu: "1" }
        requests: { memory: 80Gi, cpu: "8",  nvidia.com/gpu: "1" }
      vllm:
        modelCommand: imageDefault

