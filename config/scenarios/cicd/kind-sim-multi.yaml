# Kind Simulated Accelerators -- Multi-Model CI/CD Scenario
#
# Two InferencePools (facebook/opt-125m, facebook/opt-350m) behind a shared
# Istio Gateway on a Kind cluster. No GPUs required.
#
# HTTPRoutes are created out-of-band by ipp_benchmarking/tools/gen_httproutes.sh,
# matching on the X-Gateway-Base-Model-Name header that IPP injects. (The old
# experimentalHttpRoute self-registration is gone with the llm-d-router chart.)
#
# Topology:
#   Gateway (infra-llmdbench, shared)
#     HTTPRoute A: X-Gateway-Base-Model-Name: facebook/opt-125m -> InferencePool A
#     HTTPRoute B: X-Gateway-Base-Model-Name: facebook/opt-350m -> InferencePool B
#
# Based on config/scenarios/cicd/kind-sim.yaml (single-model) and
# config/scenarios/examples/multi-model-wva.yaml (multi-stack pattern).

# ============================================================================
# SHARED -- merged into every stack before per-stack overrides
# ============================================================================
shared:
  # CPU-only affinity for Kind
  affinity:
    enabled: true
    nodeSelector:
      kubernetes.io/os: linux

  accelerator:
    count: 0
    memory: 24

  # Inference-sim image -- no GPU needed
  # Pin to v0.8.2: "latest" switched to HTTP render sidecar (port 8082)
  # which is not configured for Kind. v0.8.2 uses UDS-based tokenizer.
  images:
    vllm:
      repository: ghcr.io/llm-d/llm-d-inference-sim
      tag: v0.8.2

  modelservice:
    enabled: true
    uriProtocol: hf

  standalone:
    enabled: false

  # Header-match routes are applied out-of-band by gen_httproutes.sh;
  # suppress the benchmark's per-stack HTTPRoute step entirely.
  httpRoute:
    enabled: false

  # Minimal gateway resources for Kind
  gateway:
    className: istio
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: "250m"
        memory: 256Mi

  # Minimal EPP resources for Kind (llm-d-router chart keys; the chart default
  # is cpu 8 / memory 8Gi, which cannot schedule on a stock kind node)
  router:
    epp:
      resources:
        requests:
          cpu: "100m"
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
    monitoring:
      prometheus:
        enabled: false

  monitoring:
    installPrometheusCrds: true

  vllmCommon:
    shmMemory: 500Mi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 500Mi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm

  prefill:
    enabled: true
    replicas: 1
    parallelism:
      tensor: 0
      data: 1
      dataLocal: 1
      workers: 1
    resources:
      limits:
        memory: 100Mi
        cpu: "0"
      requests:
        memory: 100Mi
        cpu: "0"
    accelerator:
      count: 0
    vllm:
      modelCommand: imageDefault

  decode:
    replicas: 1
    parallelism:
      tensor: 0
      data: 1
      dataLocal: 1
      workers: 1
    resources:
      limits:
        memory: 100Mi
        cpu: "0"
      requests:
        memory: 100Mi
        cpu: "0"
    accelerator:
      count: 0
    vllm:
      modelCommand: imageDefault

  # Kind uses 'standard' storage class with ReadWriteOnce only
  storage:
    modelPvc:
      accessModes:
        - ReadWriteOnce
      storageClassName: standard
      size: 4Gi   # 2 Gi per model
    workloadPvc:
      accessModes:
        - ReadWriteOnce
      storageClassName: standard
      size: 3Gi

  control:
    waitTimeout: 20

  harness:
    name: inference-perf
    experimentProfile: sanity_random.yaml
    resources:
      cpu: "1"
      memory: 8Gi

  workDir: "~/data/kind-sim-multi"

  # HTTPRoute header-match routing requires IPP in the data path — skip
  # standup smoketest and run-phase model verification which both probe
  # the gateway without the required X-Gateway-Base-Model-Name header.
  runConfig:
    skipSmoketest: true
    skipModelVerify: true


# ============================================================================
# SCENARIO -- per-model stacks
# ============================================================================
scenario:
  # --------------------------------------------------------------------------
  # facebook/opt-125m
  # --------------------------------------------------------------------------
  - name: "facebook-opt-125m"

    model:
      name: facebook/opt-125m
      shortName: facebook-opt-125m
      path: models/facebook/opt-125m
      huggingfaceId: facebook/opt-125m
      maxModelLen: 1024
      gpuMemoryUtilization: 0

  # --------------------------------------------------------------------------
  # facebook/opt-350m
  # --------------------------------------------------------------------------
  - name: "facebook-opt-350m"

    model:
      name: facebook/opt-350m
      shortName: facebook-opt-350m
      path: models/facebook/opt-350m
      huggingfaceId: facebook/opt-350m
      maxModelLen: 1024
      gpuMemoryUtilization: 0

    decode:
      resources:
        limits:
          memory: 200Mi
          cpu: "0"
        requests:
          memory: 200Mi
          cpu: "0"

    prefill:
      resources:
        limits:
          memory: 200Mi
          cpu: "0"
        requests:
          memory: 200Mi
          cpu: "0"
