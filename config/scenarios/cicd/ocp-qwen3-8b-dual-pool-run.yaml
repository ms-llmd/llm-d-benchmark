# OpenShift dual-pool Qwen3-8B -- single-stack RUN variant (one harness).
#
# Standup/teardown with cicd/ocp-qwen3-8b-dual-pool (BOTH pools). Use THIS spec only
# for `run`, so a SINGLE inference-perf harness drives load through the shared gateway
# and the HTTPRoute (weighted or IPP-smart) splits it across both pools. One harness is
# the correct, unconfounded load source. Mirrors pool A's stack so `run` finds existing
# resources and only launches the harness.

shared:
  # GPU placement comes from accelerator auto-detection. To pin a SKU, set
  # affinity.enabled: true + nodeSelector: {nvidia.com/gpu.product: <label>}.
  accelerator:
    count: 1
    memory: 80
  modelservice:
    enabled: true
    uriProtocol: hf
  standalone:
    enabled: false
  httpRoute:
    enabled: false
  gateway:
    className: istio
    resources:
      limits:   { cpu: "2",    memory: 2Gi }
      requests: { cpu: "500m", memory: 512Mi }
  # llm-d-router chart keys (chart default is cpu 8 / memory 8Gi)
  router:
    epp:
      resources:
        requests: { cpu: "200m", memory: 512Mi }
        limits:   { cpu: "1",    memory: 1Gi }
    monitoring:
      prometheus:
        enabled: true
  monitoring:
    installPrometheusCrds: false
  vllmCommon:
    shmMemory: 8Gi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    flags:
      enforceEager: false
      disableLogRequests: true
      disableUvicornAccessLog: true
  prefill:
    enabled: false
    replicas: 0
  decode:
    replicas: 1
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    accelerator:
      count: 1
    # USER/LOGNAME: without imageDefault, vLLM's getpass.getuser() crashloops on the
    # arbitrary OCP UID. See ocp-qwen3-8b-dual-pool.yaml.
    # LOGNAME only: the env macro (_macros.j2) already emits USER, and a second one
    # is a duplicate env key that Helm 4 server-side apply rejects.
    extraEnvVars:
      - name: LOGNAME
        value: vllm
  storage:
    modelPvc:
      accessModes:
        - ReadWriteMany
      size: 200Gi
    workloadPvc:
      accessModes:
        - ReadWriteMany
      size: 96Gi
  harness:
    name: inference-perf
    experimentProfile: poisson_rps_pyramid.yaml
    resources:
      cpu: "8"
      memory: 96Gi
  workDir: "~/data/ocp-qwen3-8b-dual-pool"
  monitoring:
    metricsScrapeEnabled: true
    scrapeInterval: "10s"
  runConfig:
    skipSmoketest: true
    skipModelVerify: true

# Only pool A's stack -> a single harness drives load (pools already stood up).
scenario:
  - name: "qwen3-8b-a"
    model:
      name: Qwen/Qwen3-8B-a
      shortName: qwen-qwen3-8b-a
      path: models/Qwen/Qwen3-8B
      huggingfaceId: Qwen/Qwen3-8B
      size: 30Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90
    decode:
      replicas: 2
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        # See ocp-qwen3-8b-dual-pool.yaml: NOT imageDefault so additionalFlags apply;
        # serve all names so weighted-arm requests never 404 on a pool.
        additionalFlags:
          - "--served-model-name"
          - "Qwen/Qwen3-8B"
          - "Qwen/Qwen3-8B-a"
          - "Qwen/Qwen3-8B-b"
