# Kind multi-cluster EPP leaf stack (no GPU, llm-d-inference-sim).
#
# One llm-d stack per namespace; the namespaces stand in for peer clusters.
# Stand the same scenario up twice with asymmetric capacity so the router has
# something to decide:
#
#   llmdbenchmark --spec cicd/kind-sim-mc-leaf standup -p mc-a --set decode.replicas=1
#   llmdbenchmark --spec cicd/kind-sim-mc-leaf standup -p mc-b --set decode.replicas=3
#
# The cluster-scoped router EPP (epp_benchmarking/) scores these leaves on their
# pool-aggregate metrics, scraped straight off each leaf EPP's :9090/metrics.
# That scrape is anonymous -- multicluster-metrics-data-source has no bearer
# token option -- so prometheus.auth MUST stay off or the scrape 401s and both
# scorers silently return no score.

scenario:
  - name: "kind-sim-mc-leaf"

    model:
      name: facebook/opt-125m
      shortName: facebook-opt-125m
      path: models/facebook/opt-125m
      huggingfaceId: facebook/opt-125m
      maxModelLen: 1024
      gpuMemoryUtilization: 0

    affinity:
      enabled: true
      nodeSelector:
        kubernetes.io/os: linux

    accelerator:
      count: 0
      memory: 24 # To pass capacity planner sanity checking

    gateway:
      className: istio
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: "250m"
          memory: 256Mi

    router:
      epp:
        resources:
          requests:
            cpu: "100m"
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      monitoring:
        prometheus:
          # Renders --metrics-endpoint-auth=false. Required: see header.
          auth:
            enabled: false

    monitoring:
      installPrometheusCrds: true

    vllmCommon:
      shmMemory: 500Mi

    storage:
      modelPvc:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        size: 2Gi
      workloadPvc:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        size: 3Gi

    images:
      vllm:
        repository: ghcr.io/llm-d/llm-d-inference-sim
        tag: v0.8.2

    standalone:
      enabled: false

    modelservice:
      enabled: true
      uriProtocol: hf

    # Decode-only: the routing decision under test is between clusters, and
    # two Kind clusters' worth of prefill pods does not fit on one laptop.
    decode:
      replicas: 1
      parallelism:
        tensor: 0
        data: 1
        dataLocal: 1
        workers: 1
      resources:
        limits:
          memory: 100Mi
          cpu: "0"
        requests:
          memory: 100Mi
          cpu: "0"
      accelerator:
        count: 0
      vllm:
        modelCommand: imageDefault

    prefill:
      enabled: false
      replicas: 0

    control:
      waitTimeout: 20

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      resources:
        cpu: "1"
        memory: 2Gi
